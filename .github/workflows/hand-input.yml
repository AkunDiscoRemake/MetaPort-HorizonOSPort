name: Focused original hand input conversion
on:
  push:
    branches: [arena/01a0f02d-metaport-horizonosport]
    paths: [horizon/tracking/prepare_input.py, horizon/tracking/tests/test_prepare_input.py, horizon/tracking/ghidra/DecompileHandInput.java, .github/workflows/hand-input.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metaport-hand-input
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      WORK: ${{ github.workspace }}/local-analysis/hand-input
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare verified original engine, no execution
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs binutils
          python3 -m unittest horizon.tracking.tests.test_prepare_input -v
          mkdir -p "$WORK/reports" "$WORK/project"
          curl --fail --location --retry 3 --max-time 1200 --max-filesize 10737418240 \
            --proto '=https' --proto-redir '=https' \
            'https://files.cocaine.trade/firmware/meta/Quest%203/q3_52168470052900520.zip' -o "$WORK/firmware.zip"
          echo "beea2e092f6239ca21af98466d9b130c22b9ab8822f411b00baf74ebb866858e  $WORK/firmware.zip" | sha256sum --check --strict
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          from tools.reconstruct_ota import reconstruct
          from horizon.tracking.prepare_input import prepare
          root=Path(os.environ['WORK'])
          result=reconstruct(root/'firmware.zip',root/'images',selected={'odm'})
          (root/'reconstruction.json').write_text(json.dumps(result))
          prepare(root/'images',root/'reconstruction.json',root/'reports')
          PY
      - name: Install pinned static decompiler
        run: |
          curl --fail --location --retry 3 --max-time 600 --max-filesize 1073741824 \
            --proto '=https' --proto-redir '=https' \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.3.2_build/ghidra_11.3.2_PUBLIC_20250415.zip' -o "$WORK/ghidra.zip"
          echo "99d45035bdcc3d6627e7b1232b7b379905a9fad76c772c920602e2b5d8b2dac2  $WORK/ghidra.zip" | sha256sum --check --strict
          unzip -q "$WORK/ghidra.zip" -d "$WORK"
      - name: Resolve pointer candidates and decompile bounded input functions
        id: decompile
        run: |
          "$WORK/ghidra_11.3.2_PUBLIC/support/analyzeHeadless" "$WORK/project" Input \
            -import "$WORK/reports/libtrackingengines.so" -max-cpu 2 -analysisTimeoutPerFile 900 \
            -scriptPath "$GITHUB_WORKSPACE/horizon/tracking/ghidra" \
            -postScript DecompileHandInput.java "$WORK/reports/input-strings.json" "$WORK/reports/hand-input-decompilation.json" \
            -postScript DecompileHands.java "$WORK/reports/visual-functions.txt" "$WORK/reports/visual-strings.json" "$WORK/reports/hand-input-visuals.json" \
            -deleteProject > "$WORK/ghidra.log" 2>&1
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          report=json.loads((Path(os.environ['WORK'])/'reports/hand-input-decompilation.json').read_text())
          assert any(p.get('candidate_function') for p in report['pointer_windows']), 'No executable pointer candidates'
          assert len(report['functions'])>=3, 'Insufficient selected input functions'
          assert any(f['status']=='DECOMPILED_NOT_VALIDATED' and f['selection_evidence'].startswith('Executable pointer candidate') for f in report['functions']), 'No pointer candidate decompiled'
          PY
      - name: Record measured outcome
        if: always()
        env:
          OUTCOME: ${{ steps.decompile.outcome }}
        run: |
          mkdir -p "$WORK/reports"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ['WORK']);log=p/'ghidra.log'
          result={'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                  'decompile_step':os.environ['OUTCOME'],'horizon_ported':False,'firmware_executed':False,
                  'analysis_timeout_seconds':900,'pointer_candidates_are_abi':False,
                  'log_tail':'\n'.join(log.read_text(errors='replace').splitlines()[-80:]) if log.exists() else None}
          (p/'reports/hand-input-run.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Publish evidence only, never proprietary binaries
        if: always() && github.ref == 'refs/heads/arena/01a0f02d-metaport-horizonosport'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest=analysis/builds/52168470052900520
          for name in hand-input-decompilation hand-input-visuals hand-input-run; do
            if [ -f "$WORK/reports/$name.json" ]; then
              cp "$WORK/reports/$name.json" "$dest/$name.json"
              git add -- "$dest/$name.json"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record focused original hand input evidence [skip ci]'
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" pull --rebase origin arena/01a0f02d-metaport-horizonosport
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:arena/01a0f02d-metaport-horizonosport
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-input-evidence-no-binaries
          path: ${{ env.WORK }}/reports/hand-input-*.json
          retention-days: 7
