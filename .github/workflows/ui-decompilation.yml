name: Original Horizon UI and UX decompilation
on:
  push:
    branches: [arena/01a0f02d-metaport-horizonosport]
    paths: [handtracking/ai/inspect_ui.py, handtracking/ai/requirements.txt, tools/reconstruct_ota.py, tools/scan_partitions.py, .github/workflows/ui-decompilation.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metaport-ui-decompilation
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      WORK: ${{ github.workspace }}/local-analysis/ui
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install host-only parsers and test metadata inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs binutils-aarch64-linux-gnu aapt
          python3 -m pip install -r handtracking/ai/requirements.txt
          python3 -m unittest discover -s handtracking/ai/tests -v
          python3 -m unittest discover -s horizon/ui/tests -v
          mkdir -p "$WORK/reports"
      - name: Obtain fixed verified OTA and original images
        run: |
          curl --fail --location --retry 3 --max-time 1200 --max-filesize 10737418240 \
            --proto '=https' --proto-redir '=https' \
            'https://files.cocaine.trade/firmware/meta/Quest%203/q3_52168470052900520.zip' -o "$WORK/firmware.zip"
          echo "beea2e092f6239ca21af98466d9b130c22b9ab8822f411b00baf74ebb866858e  $WORK/firmware.zip" | sha256sum --check --strict
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          from tools.reconstruct_ota import reconstruct
          p=Path(os.environ['WORK'])
          r=reconstruct(p/'firmware.zip',p/'images',selected={'system_ext'})
          (p/'reconstruction.json').write_text(json.dumps(r))
          PY
      - name: Install hash-pinned JADX from official release
        run: |
          curl --fail --location --retry 3 --max-time 600 --max-filesize 268435456 \
            --proto '=https' --proto-redir '=https' \
            'https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip' -o "$WORK/jadx.zip"
          echo "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  $WORK/jadx.zip" | sha256sum --check --strict
          unzip -q "$WORK/jadx.zip" -d "$WORK/jadx"
      - name: Decompile original settings and UI while recording oversized-source gaps
        id: decompile
        run: |
          set +e
          python3 -m handtracking.ai.inspect_ui --images "$WORK/images" \
            --reconstruction "$WORK/reconstruction.json" --jadx "$WORK/jadx/bin/jadx" --output "$WORK/reports" > "$WORK/inspection.log" 2>&1
          code=$?
          tail -n 60 "$WORK/inspection.log"
          exit "$code"
      - name: Record provenance even on analysis failure
        if: always()
        env:
          DECOMPILE_OUTCOME: ${{ steps.decompile.outcome }}
        run: |
          mkdir -p "$WORK/reports"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ['WORK'])
          log=p/'inspection.log'
          report={'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                  'decompile_step':os.environ['DECOMPILE_OUTCOME'],'horizon_ported':False,
                  'physical_phone_tested':False,'jadx_sha256':'545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974',
                  'tool_log_tail':'\n'.join(log.read_text(errors='replace').splitlines()[-100:]) if log.exists() else None}
          (p/'reports/ui-analysis-run.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Publish reports only, never firmware or models
        if: always() && github.ref == 'refs/heads/arena/01a0f02d-metaport-horizonosport'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Refresh before copying outputs: queued runs may start on an older
          # report and otherwise conflict when rebasing a replacement JSON file.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" pull --ff-only origin arena/01a0f02d-metaport-horizonosport
          dest=analysis/builds/52168470052900520
          for name in ui-decompilation ui-analysis-run; do
            if [ -f "$WORK/reports/$name.json" ]; then
              cp "$WORK/reports/$name.json" "$dest/$name.json"
              git add -- "$dest/$name.json"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record original UI DEX decompilation evidence [skip ci]'
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" pull --rebase origin arena/01a0f02d-metaport-horizonosport
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:arena/01a0f02d-metaport-horizonosport
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-decompilation-reports-no-firmware
          path: |
            ${{ env.WORK }}/reports/ui-*.json
          retention-days: 7
