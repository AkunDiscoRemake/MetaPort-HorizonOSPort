name: Android adapter runtime tests (not Horizon)
on:
  push:
    branches: [arena/01a0f02d-metaport-horizonosport]
    paths: [tools/run_android_runtime.sh, port/android/**, handtracking/native/**, .github/workflows/android-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metaport-android-runtime
  cancel-in-progress: true
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install pinned build toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Enable emulator acceleration
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Build test-only x86_64 fixtures (never release APKs)
        run: gradle -p port/android -PmetaportEmulatorTests=true :adapters:assembleDebug :adapters:assembleDebugAndroidTest
      - name: Execute Android JNI, sensor lifecycle, EGL and shader tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash tools/run_android_runtime.sh
      - name: Capture logs and explicit scope
        if: always()
        env:
          API: ${{ matrix.api }}
        run: |
          mkdir -p local-analysis/android-runtime
          # The emulator action has already stopped its device; logs were captured inside it.
          python3 - <<'PY'
          import json, os, pathlib
          report={'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                  'api':int(os.environ['API']),'abi':'x86_64','gpu':'emulated SwiftShader',
                  'scope':'Our adapter instrumentation only; test APKs are not METAPORT releases',
                  'original_firmware_executed':False,'physical_device_tested':False,
                  'arcore_camera_or_depth_tested':False,'quest_hand_inference_tested':False}
          pathlib.Path('local-analysis/android-runtime/scope.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adapter-runtime-api-${{ matrix.api }}-reports-only
          path: |
            port/android/adapters/build/reports/androidTests/
            port/android/adapters/build/outputs/androidTest-results/
            local-analysis/android-runtime/
          retention-days: 7
