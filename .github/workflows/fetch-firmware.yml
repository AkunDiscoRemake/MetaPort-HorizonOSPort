name: Fetch firmware candidate

on:
  push:
    branches:
      - arena/01a0f02d-metaport-horizonosport
    paths:
      - .github/workflows/fetch-firmware.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetch-firmware-candidate
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download fixed candidate (no extraction or execution)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firmware"
          cd "$RUNNER_TEMP/firmware"
          curl --fail --location --show-error \
            --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-delay 10 --retry-max-time 1500 \
            --connect-timeout 30 --max-time 1500 \
            --max-filesize 10737418240 \
            --output firmware.zip.part \
            'https://files.cocaine.trade/firmware/meta/Quest%203/q3_52168470052900520.zip'
          echo 'beea2e092f6239ca21af98466d9b130c22b9ab8822f411b00baf74ebb866858e  firmware.zip.part' | sha256sum --check --strict
          mv firmware.zip.part q3_52168470052900520.zip
          sha256sum q3_52168470052900520.zip > SHA256SUMS
          cat > PROVENANCE.txt <<'META'
          Candidate only: version/channel/full-image status UNVERIFIED.
          Source: https://files.cocaine.trade/firmware/meta/Quest%203/q3_52168470052900520.zip
          Expected hash source: https://cocaine.trade/Quest_3_firmware
          Hash equality does not establish authenticity or stable release status.
          Do not flash to the Infinix. No extraction or execution performed.
          META
          {
            echo '### Firmware candidate downloaded; catalog SHA-256 matched'
            echo 'Version/channel and authenticity remain UNVERIFIED.'
            echo 'Temporary artifact retention: 1 day. Not committed to Git.'
            echo "Size: $(stat --format=%s q3_52168470052900520.zip) bytes"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Store verified bytes temporarily
        uses: actions/upload-artifact@v4
        with:
          name: quest3-52168470052900520-candidate
          path: ${{ runner.temp }}/firmware/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
