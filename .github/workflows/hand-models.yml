name: Original compressed hand model inspection
on:
  push:
    branches: [arena/01a0f02d-metaport-horizonosport]
    paths: [horizon/tracking/ptez.py, horizon/tracking/pte_schema.py, horizon/tracking/tests/test_pte_schema.py, horizon/tracking/tests/test_ptez.py, .github/workflows/hand-models.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metaport-hand-models
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      WORK: ${{ github.workspace }}/local-analysis/hand-models
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install host-only parsers and test metadata inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs binutils-aarch64-linux-gnu aapt
          python3 -m unittest discover -s horizon/tracking/tests -v
          mkdir -p "$WORK/reports"
      - name: Obtain fixed verified OTA and original images
        run: |
          curl --fail --location --retry 3 --max-time 1200 --max-filesize 10737418240 \
            --proto '=https' --proto-redir '=https' \
            'https://files.cocaine.trade/firmware/meta/Quest%203/q3_52168470052900520.zip' -o "$WORK/firmware.zip"
          echo "beea2e092f6239ca21af98466d9b130c22b9ab8822f411b00baf74ebb866858e  $WORK/firmware.zip" | sha256sum --check --strict
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          from tools.reconstruct_ota import reconstruct
          p=Path(os.environ['WORK'])
          r=reconstruct(p/'firmware.zip',p/'images',selected={'odm'})
          (p/'reconstruction.json').write_text(json.dumps(r))
          PY
      - name: Inspect deflate containers without executing models
        id: inspect
        run: |
          set +e
          python3 -m horizon.tracking.ptez --images "$WORK/images" \
            --reconstruction "$WORK/reconstruction.json" --output "$WORK/reports" > "$WORK/inspection.log" 2>&1
          code=$?
          tail -n 60 "$WORK/inspection.log"
          exit "$code"
      - name: Record provenance even on analysis failure
        if: always()
        env:
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
        run: |
          mkdir -p "$WORK/reports"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ['WORK'])
          log=p/'inspection.log'
          report={'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                  'inspection_step':os.environ['INSPECT_OUTCOME'],'horizon_ported':False,
                  'physical_phone_tested':False,
                  'tool_log_tail':'\n'.join(log.read_text(errors='replace').splitlines()[-100:]) if log.exists() else None}
          (p/'reports/model-analysis-run.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Publish reports only, never firmware or models
        if: always() && github.ref == 'refs/heads/arena/01a0f02d-metaport-horizonosport'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest=analysis/builds/52168470052900520
          for name in ptez-report model-analysis-run; do
            if [ -f "$WORK/reports/$name.json" ]; then
              cp "$WORK/reports/$name.json" "$dest/$name.json"
              git add -- "$dest/$name.json"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record original compressed hand model inspection [skip ci]'
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" pull --rebase origin arena/01a0f02d-metaport-horizonosport
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:arena/01a0f02d-metaport-horizonosport
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hand-model-reports-no-models
          path: |
            ${{ env.WORK }}/reports/ptez-report.json
            ${{ env.WORK }}/reports/model-analysis-run.json
          retention-days: 7
