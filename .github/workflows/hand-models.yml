name: Original compressed hand model inspection
on:
  push:
    branches: [arena/01a1027e-metaport-horizonosport]
    paths: [handtracking/ai/ptez.py, handtracking/ai/validate_models.py, handtracking/ai/model-evidence-policy.json, handtracking/ai/tests/test_validate_models.py, handtracking/ai/tests/test_reference_fixture.py, handtracking/ai/requirements.txt, handtracking/ai/reference_probe.cpp, handtracking/ai/compare_reference.py, handtracking/ai/pte_constants.py, handtracking/ai/tests/test_pte_constants.py, handtracking/ai/pte_schema.py, handtracking/ai/tests/test_pte_schema.py, handtracking/ai/tests/test_ptez.py, .github/workflows/hand-models.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metaport-hand-models
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      WORK: ${{ github.workspace }}/local-analysis/hand-models
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install host-only parsers and test metadata inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs binutils-aarch64-linux-gnu aapt flatbuffers-compiler libflatbuffers-dev g++
          python3 -m pip install -r handtracking/ai/requirements.txt
          python3 -m unittest discover -s handtracking/ai/tests -v
          mkdir -p "$WORK/reports"
      - name: Build independent public-schema verifier, not a model runtime
        run: |
          mkdir -p "$WORK/schema"
          base=https://raw.githubusercontent.com/pytorch/executorch/4b9d44206a99c1ce39315487599971b257a02ed8/schema
          for name in program scalar_type; do
            curl --fail --location --retry 3 --max-time 60 --max-filesize 1048576 \
              --proto '=https' --proto-redir '=https' "$base/$name.fbs" -o "$WORK/schema/$name.fbs"
          done
          echo "4f944f0d6b58fde322d0d4052d7a06f3a59f9a4d1266e677c459eb1089d12b22  $WORK/schema/program.fbs" | sha256sum --check --strict
          echo "9cfdae7d02d850c6141e2abfb7998c599aba2abbffcb014971cdb989c02e7b81  $WORK/schema/scalar_type.fbs" | sha256sum --check --strict
          flatc --cpp -o "$WORK/schema" "$WORK/schema/scalar_type.fbs" "$WORK/schema/program.fbs"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -I"$WORK/schema" handtracking/ai/reference_probe.cpp -o "$WORK/reference-probe"
          METAPORT_REFERENCE_PROBE="$WORK/reference-probe" python3 -m unittest handtracking.ai.tests.test_reference_fixture -v
      - name: Obtain fixed verified OTA and original images
        run: |
          curl --fail --location --retry 3 --max-time 1200 --max-filesize 10737418240 \
            --proto '=https' --proto-redir '=https' \
            'https://files.cocaine.trade/firmware/meta/Quest%203/q3_52168470052900520.zip' -o "$WORK/firmware.zip"
          echo "beea2e092f6239ca21af98466d9b130c22b9ab8822f411b00baf74ebb866858e  $WORK/firmware.zip" | sha256sum --check --strict
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          from tools.reconstruct_ota import reconstruct
          p=Path(os.environ['WORK'])
          r=reconstruct(p/'firmware.zip',p/'images',selected={'odm'})
          (p/'reconstruction.json').write_text(json.dumps(r))
          PY
      - name: Inspect deflate containers without executing models
        id: inspect
        run: |
          set +e
          python3 -m handtracking.ai.ptez --images "$WORK/images" \
            --reconstruction "$WORK/reconstruction.json" --output "$WORK/reports" > "$WORK/inspection.log" 2>&1
          code=$?
          tail -n 60 "$WORK/inspection.log"
          exit "$code"
      - name: Compare with official generated accessors and structural verifier
        id: reference
        run: |
          python3 -m handtracking.ai.compare_reference --probe "$WORK/reference-probe" --directory "$WORK/reports"
      - name: Reject incomplete or contradictory fixed-corpus evidence
        id: validate
        run: python3 -m handtracking.ai.validate_models --directory "$WORK/reports"
      - name: Record provenance even on analysis failure
        if: always()
        env:
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          REFERENCE_OUTCOME: ${{ steps.reference.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          mkdir -p "$WORK/reports"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ['WORK'])
          log=p/'inspection.log'
          report={'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                  'inspection_step':os.environ['INSPECT_OUTCOME'],'horizon_ported':False,
                  'physical_phone_tested':False,'reference_step':os.environ['REFERENCE_OUTCOME'],
                  'evidence_validation_step':os.environ['VALIDATION_OUTCOME'],
                  'tool_log_tail':'\n'.join(log.read_text(errors='replace').splitlines()[-100:]) if log.exists() else None}
          (p/'reports/model-analysis-run.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Publish reports only, never firmware or models
        if: always() && github.ref == 'refs/heads/arena/01a1027e-metaport-horizonosport'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest=analysis/builds/52168470052900520
          for name in ptez-report model-analysis-run reference-schema-report model-evidence-validation; do
            if [ -f "$WORK/reports/$name.json" ]; then
              cp "$WORK/reports/$name.json" "$dest/$name.json"
              git add -- "$dest/$name.json"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record original compressed hand model inspection [skip ci]'
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" pull --rebase origin arena/01a1027e-metaport-horizonosport
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:arena/01a1027e-metaport-horizonosport
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hand-model-reports-no-models
          path: |
            ${{ env.WORK }}/reports/ptez-report.json
            ${{ env.WORK }}/reports/model-analysis-run.json
            ${{ env.WORK }}/reports/reference-schema-report.json
            ${{ env.WORK }}/reports/model-evidence-validation.json
          retention-days: 7
