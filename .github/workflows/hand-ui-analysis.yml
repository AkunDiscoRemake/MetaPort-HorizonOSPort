name: Original hand tracking and UI contracts
on:
  push:
    branches: [arena/01a0f02d-metaport-horizonosport]
    paths: [horizon/tracking/inspect_original.py, horizon/tracking/ghidra/DecompileHands.java, horizon/tracking/tests/test_inspect_original.py, .github/workflows/hand-ui-analysis.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metaport-hand-analysis
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      WORK: ${{ github.workspace }}/local-analysis/hands
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install host-only parsers and test metadata inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs binutils-aarch64-linux-gnu aapt
          python3 -m pip install -r horizon/tracking/requirements.txt
          python3 -m unittest discover -s horizon/tracking/tests -v
          mkdir -p "$WORK/reports"
      - name: Obtain fixed verified OTA and original images
        run: |
          curl --fail --location --retry 3 --max-time 1200 --max-filesize 10737418240 \
            --proto '=https' --proto-redir '=https' \
            'https://files.cocaine.trade/firmware/meta/Quest%203/q3_52168470052900520.zip' -o "$WORK/firmware.zip"
          echo "beea2e092f6239ca21af98466d9b130c22b9ab8822f411b00baf74ebb866858e  $WORK/firmware.zip" | sha256sum --check --strict
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          from tools.reconstruct_ota import reconstruct
          p=Path(os.environ['WORK'])
          r=reconstruct(p/'firmware.zip',p/'images',selected={'odm','system_ext'})
          (p/'reconstruction.json').write_text(json.dumps(r))
          PY
      - name: Inspect original hand models, native ABI and VrShell manifest
        run: |
          python3 -m horizon.tracking.inspect_original --images "$WORK/images" \
            --reconstruction "$WORK/reconstruction.json" --output "$WORK/reports"
      - name: Install hash-pinned Ghidra from official release
        run: |
          curl --fail --location --retry 3 --max-time 600 --max-filesize 1073741824 \
            --proto '=https' --proto-redir '=https' \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.3.2_build/ghidra_11.3.2_PUBLIC_20250415.zip' -o "$WORK/ghidra.zip"
          echo "99d45035bdcc3d6627e7b1232b7b379905a9fad76c772c920602e2b5d8b2dac2  $WORK/ghidra.zip" | sha256sum --check --strict
          unzip -q "$WORK/ghidra.zip" -d "$WORK"
      - name: Analyze native code and decompile selected hand contracts without executing them
        id: decompile
        run: |
          mkdir -p "$WORK/project"
          "$WORK/ghidra_11.3.2_PUBLIC/support/analyzeHeadless" "$WORK/project" Hands \
            -import "$WORK/reports/libtrackingengines.so" -max-cpu 2 -analysisTimeoutPerFile 900 \
            -scriptPath "$GITHUB_WORKSPACE/horizon/tracking/ghidra" \
            -postScript DecompileHands.java "$WORK/reports/functions.txt" "$WORK/reports/strings.json" "$WORK/reports/hand-decompilation.json" \
            -postScript DecompileHandInput.java "$WORK/reports/input-strings.json" "$WORK/reports/hand-input-decompilation.json" \
            -deleteProject > "$WORK/ghidra.log" 2>&1
          test -f "$WORK/reports/hand-decompilation.json"
          test -f "$WORK/reports/hand-input-decompilation.json"
          "$WORK/ghidra_11.3.2_PUBLIC/support/analyzeHeadless" "$WORK/project" Clients \
            -import "$WORK/reports/libtrackingserviceclients.so" -max-cpu 2 -analysisTimeoutPerFile 300 \
            -scriptPath "$GITHUB_WORKSPACE/horizon/tracking/ghidra" \
            -postScript DecompileHands.java "$WORK/reports/client-functions.txt" "$WORK/reports/client-strings.json" "$WORK/reports/hand-client-decompilation.json" \
            -deleteProject >> "$WORK/ghidra.log" 2>&1
          test -f "$WORK/reports/hand-client-decompilation.json"
      - name: Record provenance even on analysis failure
        if: always()
        env:
          DECOMPILE_OUTCOME: ${{ steps.decompile.outcome }}
        run: |
          mkdir -p "$WORK/reports"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ['WORK'])
          log=p/'ghidra.log'
          report={'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                  'decompile_step':os.environ['DECOMPILE_OUTCOME'],'horizon_ported':False,
                  'physical_phone_tested':False,'ghidra_sha256':'99d45035bdcc3d6627e7b1232b7b379905a9fad76c772c920602e2b5d8b2dac2',
                  'ghidra_log_tail':'\n'.join(log.read_text(errors='replace').splitlines()[-100:]) if log.exists() else None}
          (p/'reports/hand-analysis-run.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Publish reports only, never firmware or models
        if: always() && github.ref == 'refs/heads/arena/01a0f02d-metaport-horizonosport'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest=analysis/builds/52168470052900520
          for name in hand-ui-report hand-decompilation hand-input-decompilation hand-client-decompilation hand-analysis-run; do
            if [ -f "$WORK/reports/$name.json" ]; then
              cp "$WORK/reports/$name.json" "$dest/$name.json"
              git add -- "$dest/$name.json"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record original hand/UI analysis evidence [skip ci]'
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" pull --rebase origin arena/01a0f02d-metaport-horizonosport
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:arena/01a0f02d-metaport-horizonosport
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hand-ui-reports-no-firmware
          path: |
            ${{ env.WORK }}/reports/hand-*.json
          retention-days: 7
