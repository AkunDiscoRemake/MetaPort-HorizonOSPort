name: Original shell explicit RCpc compatibility experiment (not a release)
on:
  push:
    branches: [arena/01a0f02d-metaport-horizonosport]
    paths:
      - .github/workflows/original-shell-rcpc.yml
      - horizon/ui/rcpc_compat.py
      - horizon/ui/framework_dex.py
      - horizon/ui/select_framework_classes.py
      - horizon/ui/java/SelectFrameworkClasses.java
      - horizon/ui/java/VerifyDexWriter.java
      - tools/prepare_dex_tools.py
      - tests/test_framework_dex.py
      - horizon/ui/libcxx-rcpc-sites.json
      - horizon/ui/libutils-rcpc-sites.json
      - horizon/ui/dependency-rcpc-sites.json
      - tests/test_rcpc_compat.py
      - tools/shell_crash_windows.py
      - tests/test_shell_crash_windows.py
jobs:
  compatibility:
    permissions:
      contents: write
    uses: ./.github/workflows/original-shell-bundle.yml
    with:
      android_api: '36'
      rcpc_compat: true
      framework_dex: true
