name: Original Horizon surface and space ABI disassembly
on:
  push:
    branches: [arena/01a1027e-metaport-horizonosport]
    paths: [horizon/ui/prepare_platform_native.py, horizon/ui/platform-native-policy.json, .github/workflows/platform-native.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metaport-platform-native
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      WORK: ${{ github.workspace }}/local-analysis/platform-native
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install host-only parsers and test metadata inspection
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends e2fsprogs binutils-aarch64-linux-gnu aapt
          python3 -m pip install -r handtracking/ai/requirements.txt
          python3 -m unittest discover -s handtracking/ai/tests -v
          python3 -m unittest discover -s horizon/ui/tests -v
          mkdir -p "$WORK/reports"
      - name: Obtain fixed verified OTA and original images
        run: |
          curl --fail --location --retry 3 --max-time 1200 --max-filesize 10737418240 \
            --proto '=https' --proto-redir '=https' \
            'https://files.cocaine.trade/firmware/meta/Quest%203/q3_52168470052900520.zip' -o "$WORK/firmware.zip"
          echo "beea2e092f6239ca21af98466d9b130c22b9ab8822f411b00baf74ebb866858e  $WORK/firmware.zip" | sha256sum --check --strict
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          from tools.reconstruct_ota import reconstruct
          p=Path(os.environ['WORK'])
          r=reconstruct(p/'firmware.zip',p/'images',selected={'system_ext'})
          (p/'reconstruction.json').write_text(json.dumps(r))
          PY
      - name: Extract pinned original ELF and executable startup symbols
        run: |
          python3 -m horizon.ui.prepare_platform_native --images "$WORK/images" --reconstruction "$WORK/reconstruction.json" --output "$WORK/reports"
      - name: Install pinned static decompiler
        run: |
          curl --fail --location --retry 3 --max-time 600 --max-filesize 1073741824 \
            --proto '=https' --proto-redir '=https' \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.3.2_build/ghidra_11.3.2_PUBLIC_20250415.zip' -o "$WORK/ghidra.zip"
          echo "99d45035bdcc3d6627e7b1232b7b379905a9fad76c772c920602e2b5d8b2dac2  $WORK/ghidra.zip" | sha256sum --check --strict
          unzip -q "$WORK/ghidra.zip" -d "$WORK"
      - name: Decompile original surfaces, space types and observed conversion helpers
        id: decompile
        run: |
          mkdir -p "$WORK/project"
          for prefix in hzos hzos-spaces; do
            "$WORK/ghidra_11.3.2_PUBLIC/support/analyzeHeadless" "$WORK/project" "$prefix" \
              -import "$WORK/reports/$prefix.so" -max-cpu 2 -analysisTimeoutPerFile 300 \
              -scriptPath "$GITHUB_WORKSPACE/handtracking/ai/ghidra" \
              -postScript DecompileHands.java "$WORK/reports/$prefix-functions.txt" "$WORK/reports/$prefix-strings.json" "$WORK/reports/shell-$prefix-native.json" 1024 \
              -deleteProject >> "$WORK/inspection.log" 2>&1
          done
          python3 - <<'PYCODE'
          import json,os
          from pathlib import Path
          root=Path(os.environ['WORK'])/'reports'
          selection=json.loads((root/'shell-platform-native-selection.json').read_text())
          for m in selection['modules']:
              lib=m['library'];r=json.loads((root/('shell-'+lib['prefix']+'-native.json')).read_text())
              assert r['program_sha256'].lower()==lib['sha256']
              assert r['firmware_executed'] is False
              found={f['elf_address']:f for f in r['functions']}
              assert all(found[f['elf_address']]['status']=='DECOMPILED_NOT_VALIDATED' for f in m['selected'])
          PYCODE
      - name: Record provenance even on analysis failure
        if: always()
        env:
          DECOMPILE_OUTCOME: ${{ steps.decompile.outcome }}
        run: |
          mkdir -p "$WORK/reports"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ['WORK'])
          log=p/'inspection.log'
          report={'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
                  'decompile_step':os.environ['DECOMPILE_OUTCOME'],'horizon_ported':False,
                  'physical_phone_tested':False,'ghidra_sha256':'99d45035bdcc3d6627e7b1232b7b379905a9fad76c772c920602e2b5d8b2dac2',
                  'tool_log_tail':'\n'.join(log.read_text(errors='replace').splitlines()[-100:]) if log.exists() else None}
          (p/'reports/shell-platform-native-run.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Publish reports only, never firmware or models
        if: always() && github.ref == 'refs/heads/arena/01a1027e-metaport-horizonosport'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Refresh before copying outputs: queued runs may start on an older
          # report and otherwise conflict when rebasing a replacement JSON file.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" pull --ff-only origin arena/01a1027e-metaport-horizonosport
          dest=analysis/builds/52168470052900520
          for name in shell-platform-native-selection shell-hzos-native shell-hzos-spaces-native shell-platform-native-run; do
            if [ -f "$WORK/reports/$name.json" ]; then
              cp "$WORK/reports/$name.json" "$dest/$name.json"
              git add -- "$dest/$name.json"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record original surface and space API reconstructions, not validated ABI [skip ci]'
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$auth"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" pull --rebase origin arena/01a1027e-metaport-horizonosport
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:arena/01a1027e-metaport-horizonosport
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-native-reports-no-firmware
          path: |
            ${{ env.WORK }}/reports/shell-*.json
          retention-days: 7
