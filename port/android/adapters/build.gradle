plugins { id 'com.android.library' }

def emulatorTests = providers.gradleProperty('metaportEmulatorTests').orElse('false').get()
if (!(emulatorTests in ['true', 'false'])) throw new GradleException('metaportEmulatorTests must be true or false')

android {
    namespace 'org.metaport.port'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        minSdk 29
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters(emulatorTests == 'true' ? 'x86_64' : 'arm64-v8a') }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17 -Wall -Wextra -Werror' }
        }
        consumerProguardFiles 'consumer-rules.pro'
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true }
}

// Emulator builds are test-only and must never produce a release variant.
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        if (emulatorTests == 'true') variant.enable = false
    }
}

dependencies {
    implementation 'com.google.ar:core:1.48.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'junit:junit:4.13.2'
    testImplementation 'junit:junit:4.13.2'
}
